<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="50%" stop-color="#081422" />
      <stop offset="100%" stop-color="#040a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Water Crest Gradient -->
    <linearGradient id="waveGrad" x1="16" y1="18" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Core Droplet Gradient -->
    <linearGradient id="dropGrad" x1="24" y1="20" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Defensive Tactical Shield Base -->
  <path 
    d="M32 4 L53 13.5 C53 32 44.5 49 32 58.5 C19.5 49 11 32 11 13.5 Z" 
    fill="url(#shieldGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Inset -->
  <path 
    d="M32 8 L49.5 15.8 C49.5 30.5 42.5 44.5 32 53 C21.5 44.5 14.5 30.5 14.5 15.8 Z" 
    fill="none" 
    stroke="#00f2fe" 
    stroke-width="0.8" 
    stroke-opacity="0.3" 
    stroke-linejoin="round"
  />

  <!-- Dynamic Hydrodynamic Wave Surge Arc -->
  <path 
    d="M17 35 C23 28, 29 42, 36 34 C41 28.5, 45 31, 47 33 C45.5 39, 39.5 47, 32 51.5 C25 47, 19.5 41, 17 35 Z" 
    fill="url(#waveGrad)" 
    fill-opacity="0.45"
  />

  <!-- Secondary Dynamic Wave Line -->
  <path 
    d="M19 33.5 C25 27, 30 40, 37 32.5 C41.5 27.5, 45 30, 46.5 31.5" 
    fill="none" 
    stroke="#38bdf8" 
    stroke-width="2" 
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Central Jal (Water Droplet / Rakshak Core) -->
  <path 
    d="M32 16 C32 16, 23 28, 23 35 C23 39.97, 27.03 44, 32 44 C36.97 44, 41 39.97, 41 35 C41 28, 32 16, 32 16 Z" 
    fill="url(#dropGrad)" 
    stroke="#a5f3fc" 
    stroke-width="1.2"
    filter="url(#glow)"
  />

  <!-- Internal Droplet Specular Reflection -->
  <path 
    d="M28 30 C27 33, 27 36, 29 39" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    stroke-opacity="0.85"
  />

  <!-- Apex Sparkle / Sensor Dot -->
  <circle cx="32" cy="11" r="1.8" fill="#38bdf8" filter="url(#glow)" />
</svg>